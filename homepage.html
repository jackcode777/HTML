<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mbe home page</title>
    <style>
        * {box-sizing:border-box;}
        .container {
            display: flex;
            flex-direction:row;
            padding:20px;
            gap:10px;
            width:100vw;
            height:100vh;
        }
        .aside {
            display:flex;
            flex-direction:column;
            gap:20px;
        }
        
        nav {
           padding:10px;
           width:180px;
           height:100vh;
        }
        button {
            border:none;
            border-left:3px solid rgba(40,40,225,0.8);
            box-shadow:1px 1px 15px #ccc;
            width:100%;
            padding:7px;
        }
        main {
            display: grid;
            grid-template-rows:1fr 0px 0px;
            border:none;
            box-shadow:0 0 15px 3px #ccc;
            border-radius:5px;
            width:100%;
            height:100%;
            padding:25px;
        }
        iframe {
            transition:1s ease;
            flex:1;
            width:100%;
            height:100%;
        }
        #discount {
            display:none;
        }
        #insurance {
            display:none;
        }
        #measurement {
            display: none;
        }
        button:focus {
            transition:1s ease;
            box-shadow:none;
            background:linear-gradient(to right, rgb(143, 143, 231), white);
        }
    </style>
</head>
 <body> 
    <div class="container">

        <nav>
            <div class="aside">
              <div class="col">
                  <button onclick="discountBTN()">Discount</button>
              </div>
              <div class="col">
                  <button onclick="insuranceBTN()">Insurance</button>
              </div>
              <div class="col">
                  <button onclick="measurementBTN()">Measurement</button>
              </div>
            </div>
        </nav>

        <main>
            <iframe src="d.html" id="discount"></iframe>
            <iframe src="insurance.html" id="insurance"></iframe>
            <iframe src="measurement.html" id="measurement"></iframe>
        </main>
    </div>
    <script>
        function discountBTN() {
            //grab element by id
            const dis = document.getElementById("discount");
            document.getElementById("insurance").style.display = "none";
            document.getElementById("measurement").style.display = "none";
            dis.style.display = "block";
            return;
        }
        function insuranceBTN() {
            //grab element by id
            const ins = document.getElementById("insurance");
            document.getElementById("discount").style.display = "none";
            document.getElementById("measurement").style.display = "none";
            ins.style.display = "block";
            return;
        }
        function measurementBTN() {
            //grab element by id
            const m = document.getElementById("measurement");
            document.getElementById("discount").style.display = "none";
            document.getElementById("insurance").style.display = "none";
            m.style.display = "block";
            return;
        }
    </script>
</body>
</html>
