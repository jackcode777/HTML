<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mailbox etc.</title>
    <style>
        * {box-sizing:border-box;}
        div.card {
            display:grid;
            overflow: hidden;
            grid-template-rows:30px 70px auto;
            gap:30px;
            margin: 32px auto;
            padding:10px;
            width:400px;
            border:1px solid gray;
            border-radius:20px;
            background:#ccc;
            box-shadow:0px 15px 15px #ccc;
        }
        .container {
            padding:15px;
            width:100%;
            border-radius:5px;
            box-shadow:0 0 5px 1px rgb(199, 191, 191);
            border-top:3px solid black;
            background:linear-gradient(to right, grey, darkgray);
            margin-bottom:10px;
        }
        .col {
            display:flex;
            flex-direction: row;
            gap:3px;
        }
        .action {
            display:grid;
            grid-template-columns:auto auto;
            align-content:center;
            column-gap:10px;
        }
        .btn-style {
            display: inline-block;
            border-radius:10px;
            border:1px solid gray;
        }
        button[onclick="checkBTN()"] {
            box-shadow:0 0 5px 2px gray;
        }
        button[onclick="clearBTN()"] {
            box-shadow:0 0 5px 2px gray;
        }
        button[onclick="checkBTN()"]:active {
            box-shadow:none;
        }
        button[onclick="clearBTN()"]:active {
            box-shadow: none;
        }
        label[for="userinput"] {display:inline-block; margin-bottom:3px;}
        button, input {width:100%; height:40px; border-radius:10px; border:1px solid gray; padding:10px;}
        input:focus {outline:1px solid black; box-shadow:0 0 0 3px rgba(50,50,50,0.5);}
    </style>
</head>
<body>
    <h1 style="text-align: center;">Discount Checker</h1>
    <div class="card">
        <div class="inputcon">
           <label for="userinput">Courier Fee:</label><span style="color:red;"></span><br>
           <input type="text" id="input" name="userinput" placeholder="Enter" required> 
        </div>
        <div class="action">
            <div class="btn-style">
              <button onclick="checkBTN()">Check</button>
           </div>
           <div class="btn-style">
              <button onclick="clearBTN()">Clear</button>
            </div>
        </div>   
        <div class="container">
            <div class="col">
               <label for="output">Amount:</label>
               <p id="output">output</p>
            </div>
            <br>
            <div class="col">
                <label for="x">Discount value:</label>
                <p id="x"></p>
            </div>
        </div>
    </div>
    <script>
        function checkBTN() {
            //grab html input and output element
            const error = document.querySelector("span");
            const x = Number(document.getElementById("input").value.trim());
            const output = document.getElementById("output");

            //convert input into 2 decimal place e.g. 12.34
            const input = parseFloat(x);

            //Validate input
            if (isNaN(input) || !input) {
                error.textContent = "Invalid!";
                return;
            }

            //clear error msg 
            error.textContent = "";

            //perform math
            const val1 = input / 100; 
            const val2 = val1 * 5;
            const result = input - val2;
            output.innerHTML = `$${result.toFixed(2)}`;
            document.getElementById("x").textContent = "- 5%";
        }
        function clearBTN() {
            document.querySelector("span").textContent = "";
            document.getElementById("x").textContent = "";
            input.value = "";
            output.innerHTML = "";
        }
    </script>
</body>
</html>
